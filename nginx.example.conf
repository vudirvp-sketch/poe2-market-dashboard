# ============================================================
# Nginx reverse proxy configuration for PoE2 Market Dashboard
# ============================================================
#
# This config places both Next.js (port 3000) and the FastAPI
# backend (port 8000) behind a single nginx server so that:
#
#   - The frontend is served at /
#   - REST API calls to /api/flipper/* are proxied to :8000
#   - WebSocket connections to /ws/* are upgraded and proxied to :8000
#   - No CORS issues because everything is same-origin
#   - The browser never connects to :8000 directly
#
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/poe2-dashboard
#   2. Edit server_name to match your domain
#   3. ln -s /etc/nginx/sites-available/poe2-dashboard /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# For HTTPS, use certbot / Let's Encrypt:
#   sudo certbot --nginx -d your-domain.com
# ============================================================

upstream nextjs {
    server 127.0.0.1:3000;
}

upstream flipper_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name your-domain.com;  # <-- change this

    # ---- Next.js frontend ----
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Next.js HMR websocket (dev mode only) ----
    location /_next/webpack-hmr {
        proxy_pass http://nextjs/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- Flipper REST API ----
    location /api/ {
        # Route /api/* to the FastAPI backend.
        # The backend's routes are prefixed with /api/
        # (e.g. /api/prices, /api/events, /api/health)
        proxy_pass http://flipper_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Flipper WebSocket endpoints ----
    location /ws/ {
        proxy_pass http://flipper_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket connections are long-lived — 24h timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- Static assets (optional: serve directly) ----
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Cache static assets aggressively
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
