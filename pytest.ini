[pytest]
# Pytest configuration for PoE2 Flipper project
# 
# Markers:
#   e2e - End-to-end tests requiring live or mock API
#
# Asyncio mode:
#   auto - Automatically detect async test functions
#
# Test discovery:
#   tests/ directory at project root

markers =
    e2e: end-to-end tests requiring live or mock API
    asyncio: async test functions (handled by pytest-asyncio)

asyncio_mode = auto

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short summary of failures at the end
addopts = -v --tb=short

# Ignore the Next.js/TypeScript frontend directory
norecursedirs = src node_modules .next e2e .git .github

# Minimum Python version
minversion = 3.11
