name: Build, Test & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ──────────────────────────────────────────────────────
  # Job 1: Lint + Build (fast, runs first)
  # ──────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify .next directory
        run: |
          if [ ! -d ".next" ]; then
            echo "ERROR: .next directory not found after build!"
            exit 1
          fi
          echo "OK: .next directory exists, build verified."

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 7

  # ──────────────────────────────────────────────────────
  # Job 2: Jest Unit Tests (parallel with build)
  # ──────────────────────────────────────────────────────
  test-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest unit tests
        run: npm test -- --coverage --ci --forceExit
        env:
          NODE_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────
  # Job 3: Python Backend Tests
  # ──────────────────────────────────────────────────────
  test-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .

  # ──────────────────────────────────────────────────────
  # Job 5: Update Cache Snapshot (on push to main only)
  # ──────────────────────────────────────────────────────
  update-cache-snapshot:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate cache snapshot
        run: npx tsx scripts/generate-cache-snapshot.ts
        env:
          POE2_API_BASE_URL: https://api.poe2scout.com/api
          POE2_SNAPSHOT_REALM: poe2
          POE2_SNAPSHOT_LEAGUE: runes

      - name: Check for snapshot changes
        id: snapshot-diff
        run: |
          if git diff --quiet src/data/cache-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in cache snapshot."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Cache snapshot has been updated."
            git diff --stat src/data/cache-snapshot.json
          fi

      - name: Commit and push updated snapshot
        if: steps.snapshot-diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/cache-snapshot.json
          git commit -m "chore: update cache-snapshot.json [skip ci]"
          git push

  # ──────────────────────────────────────────────────────
  # Job 4: Playwright E2E Tests (after build)
  # ──────────────────────────────────────────────────────
  test-e2e:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
