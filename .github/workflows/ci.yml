name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Regenerate cache-snapshot.json every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run test

      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest tests/ -v --tb=short

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
         NEXT_PUBLIC_API_BASE_URL: http://localhost:3000

  refresh-cache:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Regenerate cache-snapshot.json
        run: npx tsx scripts/generate-cache-snapshot.ts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: auto-refresh cache-snapshot.json"
          title: "chore: auto-refresh cache-snapshot.json"
          branch: auto-refresh-cache
          delete-branch: true
          body: |
            Automated cache-snapshot.json refresh.

            Generated by CI workflow on schedule or manual trigger.
