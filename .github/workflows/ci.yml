name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ── Frontend: lint, type-check, Jest unit tests ──
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Jest unit tests
        run: npx jest --no-cache --ci --coverage=false

  # ── Backend: Python lint + pytest ──
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ── Regenerate cache snapshot ──
  # Ensures cache-snapshot.json stays up-to-date with the live API.
  # If the API is unreachable, the step fails but does NOT block the PR.
  cache-snapshot:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate cache snapshot
        run: npx tsx scripts/generate-cache-snapshot.ts
        env:
          POE2_SNAPSHOT_REALM: poe2
          POE2_SNAPSHOT_LEAGUE: runes

      - name: Check for snapshot changes
        run: |
          if git diff --quiet src/data/cache-snapshot.json; then
            echo "cache-snapshot.json is up-to-date"
          else
            echo "::warning::cache-snapshot.json is stale — run 'npx tsx scripts/generate-cache-snapshot.ts' locally and commit the update"
            git diff --stat src/data/cache-snapshot.json
          fi

  # ── E2E Playwright tests (only on push to main, not PRs) ──
  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # The dev server auto-starts via playwright.config.ts webServer
          CI: true
