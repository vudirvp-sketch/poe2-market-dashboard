name: CI — Lint, Test & Cache Snapshot Update

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger for cache snapshot regeneration
  workflow_dispatch:

jobs:
  # ── Job 1: Jest unit tests ──
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npx jest --no-cache --ci --coverage

  # ── Job 2: Python backend tests ──
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ── Job 3: Auto-update cache snapshot (only on push to main) ──
  update-cache-snapshot:
    needs: test-frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate cache snapshot
        run: npx tsx scripts/generate-cache-snapshot.ts
        env:
          POE2_API_BASE_URL: https://api.poe2scout.com/api
          POE2_SNAPSHOT_REALM: poe2
          POE2_SNAPSHOT_LEAGUE: runes

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --exit-code src/data/cache-snapshot.json || \
            git add src/data/cache-snapshot.json && \
            git commit -m "chore: auto-update cache-snapshot.json" && \
            git push

  # ── Job 4: Playwright E2E tests ──
  test-e2e:
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
