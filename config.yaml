# PoE2 Flipper Configuration
# All tunable parameters live here. Agents must NOT hardcode values that belong in config.

data:
  primary_provider: "poe2scout"
  fallback_provider: "official"
  poe2scout_base_url: "https://api.poe2scout.com/api"
  # CORS proxy for backend — set this to your Cloudflare Worker URL
  # if the backend cannot reach poe2scout.com directly (e.g. blocked region).
  # Can also be set via POE2SCOUT_CORS_PROXY_URL env var (takes precedence).
  # Example: "https://poe2scout-proxy.your-account.workers.dev/api"
  cors_proxy_url: ""
  # When True, automatically retry through cors_proxy_url if primary URL fails
  cors_proxy_fallback_enabled: true
  cache_ttl_prices_minutes: 5
  cache_ttl_history_hours: 24
  cache_ttl_metadata_hours: 1
  rate_limit_per_second: 1
  historical_retention_days: 90

league:
  league_name: "runes"               # Runes of Aldur — current league (ShortName from API)
  realm: "poe2"                      # POE2Scout API realm path segment — NOT "poe2/pc" (that's the RealmOption.value, not the path param)
  league_start_date: "2026-05-29T20:00:00Z"  # Runes of Aldur launch date (May 29, 2026 1PM PDT = 20:00 UTC) — update when a new league starts
  # Override: 14 days for early phase
  phase_early_days: 14
  phase_mid_days: 42
  base_currency: "exalted"
  currency_categories:               # Known POE2 currency categories for ByCategory pagination
    - currency
    - fragments
    - runes
    - essences
    - ultimatum
    - expedition
    - ritual
    - vaultkeys
    - breach
    - abyss
    - uncutgems
    - lineagesupportgems
    - delirium
    - incursion
    - idol
    - verisium
    - vaal
  # Categories where items are priced ON the exchange but are NOT pure currencies.
  # Exchange pairs where currency1CategoryApiId ∈ item_categories represent
  # craft items (Omens, Soul Cores, etc.) priced in multiple payment currencies.
  # The optimal-payment logic groups these separately to find the cheapest
  # currency to pay with for each item.
  item_categories:
    - ritual       # Ritual Omens
    - ultimatum    # Soul Cores
    - idol         # Idols
    - vaultkeys    # Reliquary Keys
    - delirium     # Delirium items

# Gold fee configuration has been removed. Gold fees are permanently excluded
# from all scoring, arbitrage, and storage-value calculations because gold is
# a consumable in PoE2 with no real trade value for small-scale flippers.
# See AGENT_NAVIGATION.md §10 #10 and PoE2_Flipper_Canonical_Formulas.md §3.

filters:
  min_volume_24h: 20  # Lowered from 200 for early-league compatibility (4-day-old league has low volumes)
  max_volatility: 0.4
  max_spread: 0.15  # Max allowed spread for quick filter
  exclude_volatile_illiquid: false

scoring:
  momentum_negative_threshold: -0.01
  volatility_reference: 0.05
  phase_multiplier_early: 1.2
  phase_multiplier_mid: 1.0
  phase_multiplier_late: 0.9
  flashback_multiplier: 1.5
  event_multiplier: 2.0

forecasting:
  sarima_seasonal_period: null  # auto-detect
  lightgbm_retrain_interval_hours: 6
  lightgbm_mape_trigger: 0.15
  lightgbm_min_data_points: 15  # Lowered from 30 so LightGBM trains on reduced data (5-9 daily points)
  forecast_horizon_hours: 24
  significance_level: 0.05  # alpha — confidence = 1 - alpha = 0.95

anomaly:
  bonferroni_alpha: 0.01
  alert_score_threshold: 0.4
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  stl_residual_threshold_mad: 2
  momentum_sustained_periods: 3

clustering:
  n_clusters: 3
  recluster_interval_hours: 1

portfolio:
  method: "risk_parity"  # "risk_parity" or "min_variance"
  correlation_shock_threshold: 0.5
  correlation_shock_position_reduction: 0.5
  ledoit_wolf_shrinkage: true
  rebalance_interval_hours: 24

events:
  default_expiry_hours: 48
  event_score_penalty: 0.5

storage_value:
  buy_threshold: 1.03
  sell_threshold: 0.97
  liquidity_normalization: 10.0

scheduler:
  enabled: true
  price_snapshot_interval_minutes: 30     # Write current prices to SQLite
  reclustering_interval_hours: 1          # Re-run currency clustering
  model_retrain_interval_hours: 6         # LightGBM retraining check
  model_persistence_interval_minutes: 30  # Save LightGBM models to disk
  event_pruning_interval_minutes: 15      # Prune expired events

# P1-3: Currency tier classification boundaries based on RelativePrice ONLY.
# Do NOT hardcode currency names — different leagues have different RelativePrice values.
tiers:
  boundaries:
    t0_min: 50.0      # Ultra: Mirror of Kalandra, etc.
    t1_min: 10.0      # High: Divine Orb
    t2_min: 1.0       # Core: Exalted Orb, Chaos Orb
    t3_min: 0.1       # Mid: Orb of Regret, Annulment Shard
    t4_min: 0.01      # Low: Orb of Transmutation, Augmentation
    # Below t4_min = T5 (Micro): Scroll of Wisdom, etc.

# P1-1: Quantization parameters for integer-aware spread analysis
quantization:
  default_lot_sizes: [1, 5, 10, 50, 100]
  max_lot_search: 10000
  brick_resistance_weight: 0.2

# P1-5: Historical benchmarks lookback configuration
benchmarks:
  lookback_days: 30
  include_league_lifetime: true

# Liquid Chain: vendor reforge conversion chains (3:1 ratio by default).
# Each chain step defines an item that can be reforged into the next item
# at the vendor. The module computes per-step and cumulative profit/loss
# to help users decide whether reforging is worthwhile.
liquid_chain:
  chains:
    - name: "delirium_liquids"
      category: "delirium"  # POE2Scout ByCategory — where to fetch prices
      steps:
        - api_id: "diluted-liquid-ire"
          name_en: "Diluted Liquid Ire"
          name_ru: "Разбавленный жидкий гнев"
          ratio: 3
        - api_id: "diluted-liquid-guilt"
          name_en: "Diluted Liquid Guilt"
          name_ru: "Разбавленная жидкая вина"
          ratio: 3
        - api_id: "diluted-liquid-greed"
          name_en: "Diluted Liquid Greed"
          name_ru: "Разбавленная жидкая жадность"
          ratio: 3
        - api_id: "liquid-paranoia"
          name_en: "Liquid Paranoia"
          name_ru: "Жидкая паранойя"
          ratio: 3
        - api_id: "liquid-envy"
          name_en: "Liquid Envy"
          name_ru: "Жидкая зависть"
          ratio: 3
        - api_id: "liquid-disgust"
          name_en: "Liquid Disgust"
          name_ru: "Жидкое отвращение"
          ratio: 3
        - api_id: "liquid-despair"
          name_en: "Liquid Despair"
          name_ru: "Жидкое отчаяние"
          ratio: 3
        - api_id: "concentrated-liquid-fear"
          name_en: "Concentrated Liquid Fear"
          name_ru: "Концентрированный жидкий страх"
          ratio: 3
        - api_id: "concentrated-liquid-suffering"
          name_en: "Concentrated Liquid Suffering"
          name_ru: "Концентрированное жидкое страдание"
          ratio: 3
        - api_id: "concentrated-liquid-isolation"
          name_en: "Concentrated Liquid Isolation"
          name_ru: "Концентрированное жидкое отчуждение"
          ratio: 1  # Last step — no further reforge

    # Ritual Omens — price tier monitoring chain.
    # NOTE: Ritual Omens CANNOT be reforged at the vendor (unlike Delirium
    # liquids). This chain exists purely for price comparison: it shows the
    # relative cost of omens sorted from cheapest to most expensive tier.
    # The "profit" column shows the price difference between tiers, which
    # helps identify when a higher-tier omen is cheaper than expected.
